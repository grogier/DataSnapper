services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: datasnapper:latest
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8080:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Optional HTTPS reverse proxy. Enable with:
