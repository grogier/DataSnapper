{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{% url 'organization-list' %}">Companies</a> / {{ title }}</div>
<div class="page-header">
  <div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-subtitle">Store the legal entity, privacy contact and policy links.</p>
  </div>
</div>

<form method="post" class="card">
  {% csrf_token %}
  <div class="card-body">
    <div class="form-grid">
      {% include "partials/form_fields.html" %}
    </div>
  </div>
  <div class="card-footer form-actions">
    <button class="btn btn-primary" type="submit">Save company</button>
    <a class="btn" href="{% if organization %}{{ organization.get_absolute_url }}{% else %}{% url 'organization-list' %}{% endif %}">Cancel</a>
  </div>
</form>
{% endblock %}
